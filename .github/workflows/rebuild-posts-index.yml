name: Rebuild posts.json

on:
  push:
    paths:
      - '_posts/**'
      - 'scripts/rebuild_posts_index.py'
      - 'scripts/render_post_listings.py'
      - 'scripts/request_pages_build.py'
      - '.github/workflows/rebuild-posts-index.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '_posts/**'
      - 'scripts/rebuild_posts_index.py'
      - 'scripts/render_post_listings.py'
      - 'scripts/request_pages_build.py'
      - '.github/workflows/rebuild-posts-index.yml'

permissions:
  contents: read

concurrency:
  group: post-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/rebuild_posts_index.py --check
      - run: python scripts/render_post_listings.py --check
      - run: python -m py_compile scripts/request_pages_build.py

  rebuild-index:
    if: github.event_name != 'pull_request' && github.event.deleted != true
    needs: validate-index
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      commit: ${{ steps.publish.outputs.commit }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild posts.json from published HTML
        run: python scripts/rebuild_posts_index.py

      - name: Refresh static article listings
        run: python scripts/render_post_listings.py

      - name: Commit updated posts.json
        id: publish
        env:
          INDEX_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "TFR Publisher Bot"
          git config user.email "bot@techfusionreport.com"
          git add posts.json index.html blog.html technology.html entertainment.html productivity.html ai.html smartphones.html smart_home.html android_apps.html mac-apps.html smartphone-apps.html tips_tricks.html gtk_websites.html movies.html tv_shows.html music.html office.html workflows.html productivity_apps.html
          if git diff --staged --quiet; then
            echo "Published metadata and listings unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "index: refresh published metadata and static listings [skip ci]"
          git push origin "HEAD:$INDEX_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  request-pages-build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.rebuild-index.outputs.changed == 'true'
    needs: rebuild-index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebuild-index.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Request Pages rebuild after generated publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py --request
