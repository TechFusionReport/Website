    <script>
        // Mobile menu toggle with improved accessibility
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuButton = document.getElementById('mobile-menu');
            const navMenu = document.getElementById('nav-menu');
            
            mobileMenuButton.addEventListener('click', function() {
                const isExpanded = navMenu.classList.contains('show');
                navMenu.classList.toggle('show');
                mobileMenuButton.setAttribute('aria-expanded', !isExpanded);
            });
            
            // Close menu when clicking outside
            document.addEventListener('click', function(event) {
                if (!mobileMenuButton.contains(event.target) && 
                    !navMenu.contains(event.target) && 
                    navMenu.classList.contains('show')) {
                    navMenu.classList.remove('show');
                    mobileMenuButton.setAttribute('aria-expanded', 'false');
                }
            });
            
            // Add keyboard support
            mobileMenuButton.setAttribute('aria-expanded', 'false');
            mobileMenuButton.setAttribute('aria-controls', 'nav-menu');
        });
        
        // Preload important images
        const preloadImages = () => {
            const imagesToPreload = [
                './images/TFR_Header_Logo_NB.png',
                './images/Tech_NB.png',
                './images/Entertainment_NB.png',
                './images/prod_NB.png'
            ];
            
            imagesToPreload.forEach(imageSrc => {
                const img = new Image();
                img.src = imageSrc;
            });
        };
        
        // Execute preloading after critical content is loaded
        window.addEventListener('load', preloadImages);
    </script>
